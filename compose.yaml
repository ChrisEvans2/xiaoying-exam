services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: xiaoying
      POSTGRES_USER: xiaoying
      POSTGRES_PASSWORD: xiaoying
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaoying -d xiaoying"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
