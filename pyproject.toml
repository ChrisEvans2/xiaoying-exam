[project]
name = "xiaoying-exam"
version = "0.1.0"
description = "Versioned enterprise knowledge QA with auditable evidence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.4,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "openai>=2,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2", "markdown-it-py>=3,<5", "beautifulsoup4>=4.13,<5",
  "pyyaml>=6,<7", "jieba>=0.42.1,<1", "numpy>=2,<3", "pypdf>=5,<7",
]

[project.optional-dependencies]
models = ["sentence-transformers>=5,<6"]
mineru = ["mineru>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
xiaoying = "xiaoying.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaoying"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL with pgvector", "live: requires real model credentials"]

[tool.ruff]
target-version = "py312"
line-length = 110
